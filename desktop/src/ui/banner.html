<!DOCTYPE html><html><head><meta charset="utf-8"><title>Setu Remote session</title><meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline'">
<style>
@font-face{font-family:Mukta;font-weight:600;src:url(../../assets/fonts/mukta-latin-600-normal.woff2)}
@font-face{font-family:Mukta;font-weight:700;src:url(../../assets/fonts/mukta-latin-700-normal.woff2)}
html,body{margin:0;height:100%;background:#F2A20C;color:#15202B;font-family:Mukta,'Segoe UI',sans-serif;overflow:hidden;-webkit-app-region:drag;user-select:none}
body{display:flex;align-items:center;gap:12px;padding:0 8px 0 16px;box-sizing:border-box}
b{font-size:15.5px;font-weight:700;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
span{font-size:14.5px;font-weight:700;background:rgba(255,255,255,.55);padding:2px 10px;border-radius:10px;font-variant-numeric:tabular-nums}
button{-webkit-app-region:no-drag;height:36px;padding:0 16px;border:0;border-radius:10px;background:#C8372D;color:#fff;font:600 15px Mukta,'Segoe UI',sans-serif;cursor:pointer}
</style></head><body><b id="t"></b><span id="tm">0:00</span><button id="stop">Stop</button>
<script>
const name = new URLSearchParams(location.search).get('name') || 'Your phone';
document.getElementById('t').textContent = name + (new URLSearchParams(location.search).get('what') === 'camera' ? ' is viewing this PC\u2019s camera' : ' is controlling this PC');
const t0 = Date.now();
setInterval(() => { const s = Math.floor((Date.now() - t0) / 1000); document.getElementById('tm').textContent = Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); }, 1000);
document.getElementById('stop').onclick = () => window.banner.stop();
</script></body></html>
